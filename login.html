
<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Masuk — UndanganKu</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #ffdce6,
          transparent 40%
        ),
        #fff7f9;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }


    .box {

      width: 100%;

      max-width: 430px;

      background: white;

      padding: 32px;

      border-radius: 25px;

      box-shadow:
        0 20px 60px
        rgba(120,60,80,.15);
    }


    .logo {

      text-align: center;

      font-size: 24px;

      font-weight: bold;

      color: #b65b77;

      margin-bottom: 10px;
    }


    h1 {

      text-align: center;

      font-family: Georgia, serif;

      color: #35282d;

      margin-bottom: 8px;
    }


    .description {

      text-align: center;

      color: #806b72;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 25px;
    }


    label {

      display: block;

      margin-bottom: 6px;

      font-weight: bold;

      font-size: 14px;
    }


    input {

      width: 100%;

      padding: 14px;

      border: 1px solid #ead3da;

      border-radius: 12px;

      outline: none;

      font-size: 15px;

      margin-bottom: 16px;
    }


    input:focus {

      border-color: #b65b77;
    }


    button {

      width: 100%;

      padding: 15px;

      border: 0;

      border-radius: 13px;

      background: #b65b77;

      color: white;

      font-weight: bold;

      font-size: 15px;

      cursor: pointer;
    }


    #message {

      text-align: center;

      margin-top: 15px;

      font-size: 14px;
    }


    .register {

      text-align: center;

      margin-top: 20px;

      font-size: 14px;

      color: #806b72;
    }


    .register a {

      color: #b65b77;

      font-weight: bold;

      text-decoration: none;
    }


    .back {

      display: block;

      text-align: center;

      margin-top: 15px;

      color: #806b72;

      text-decoration: none;

      font-size: 13px;
    }

  </style>

</head>


<body>


<div class="box">


  <div class="logo">
    💍 UndanganKu
  </div>


  <h1>Selamat Datang</h1>


  <p class="description">
    Masuk untuk mengelola undangan
    pernikahanmu.
  </p>


  <form id="loginForm">


    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="nama@email.com"
      required
    >


    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >


    <button type="submit">
      Masuk
    </button>


  </form>


  <p id="message"></p>


  <div class="register">

    Belum punya akun?

    <a href="register.html">
      Daftar Gratis
    </a>

  </div>


  <a href="index.html" class="back">
    ← Kembali ke halaman utama
  </a>


</div>



<script type="module">

  import {

    auth,

    signInWithEmailAndPassword

  } from "./firebase.js";


  const form =
    document.getElementById("loginForm");

  const message =
    document.getElementById("message");


  form.addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      message.style.color =
        "#806b72";

      message.textContent =
        "Memeriksa akun...";


      try {


        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        message.style.color =
          "green";


        message.textContent =
          "Login berhasil. Mengarahkan...";


        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 700);


      } catch(error) {


        console.error(error);


        message.style.color =
          "#c0392b";


        if(
          error.code ===
          "auth/invalid-credential"
        ) {

          message.textContent =
            "Email atau password salah.";

        }

        else if(
          error.code ===
          "auth/invalid-email"
        ) {

          message.textContent =
            "Format email tidak valid.";

        }

        else {

          message.textContent =
            error.message;

        }

      }

    }

  );

</script>


</body>
</html>
