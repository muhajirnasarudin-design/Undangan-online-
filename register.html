<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daftar — UndanganKu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #ffdce6, transparent 40%),
        #fff7f9;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;

      background: white;
      padding: 32px;

      border-radius: 25px;

      box-shadow:
        0 20px 60px rgba(120,60,80,.15);
    }

    .logo {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #b65b77;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-family: Georgia, serif;
      color: #35282d;
      margin-bottom: 8px;
    }

    .description {
      text-align: center;
      color: #806b72;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
      color: #4b383e;
    }

    input {
      width: 100%;
      padding: 14px;

      border: 1px solid #ead3da;
      border-radius: 12px;

      outline: none;
      font-size: 15px;

      margin-bottom: 16px;
    }

    input:focus {
      border-color: #b65b77;
    }

    button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: 13px;

      background: #b65b77;
      color: white;

      font-weight: bold;
      font-size: 15px;

      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .login {
      text-align: center;
      margin-top: 20px;

      font-size: 14px;
      color: #806b72;
    }

    .login a {
      color: #b65b77;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;

      color: #806b72;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">
    💍 UndanganKu
  </div>

  <h1>Buat Akun</h1>

  <p class="description">
    Buat akun untuk membuat dan mengelola
    undangan pernikahanmu.
  </p>

  <form id="registerForm">

    <label>Nama</label>

    <input
      type="text"
      id="name"
      placeholder="Nama lengkap"
      required
    >

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="nama@email.com"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Minimal 6 karakter"
      minlength="6"
      required
    >

    <button type="submit">
      Buat Akun
    </button>

  </form>

  <p id="message"></p>

  <div class="login">
    Sudah punya akun?
    <a href="login.html">Masuk</a>
  </div>

  <a href="index.html" class="back">
    ← Kembali ke halaman utama
  </a>

</div>

<script type="module">

  import {
    auth,
    db,
    createUserWithEmailAndPassword,
    updateProfile,
    doc,
    setDoc,
    serverTimestamp
  } from "./firebase.js";


  const form = document.getElementById("registerForm");
  const message = document.getElementById("message");


  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    message.style.color = "#806b72";
    message.textContent = "Membuat akun...";


    try {

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user = result.user;


      await updateProfile(user, {
        displayName: name
      });


      await setDoc(
        doc(db, "users", user.uid),
        {
          uid: user.uid,
          name: name,
          email: email,
          createdAt: serverTimestamp()
        }
      );


      message.style.color = "green";

      message.textContent =
        "Akun berhasil dibuat. Mengarahkan...";


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 1000);


    } catch(error) {

      console.error(error);

      message.style.color = "#c0392b";

      if(error.code === "auth/email-already-in-use") {

        message.textContent =
          "Email sudah terdaftar.";

      } else if(error.code === "auth/invalid-email") {

        message.textContent =
          "Format email tidak valid.";

      } else if(error.code === "auth/weak-password") {

        message.textContent =
          "Password terlalu lemah.";

      } else {

        message.textContent =
          error.message;

      }

    }

  });

</script>

</body>
</html>
