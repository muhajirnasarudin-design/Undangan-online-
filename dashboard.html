
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard — UndanganKu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7f9;
      color: #35282d;
    }

    a {
      text-decoration: none;
    }

    /* HEADER */

    header {
      height: 70px;
      background: white;
      border-bottom: 1px solid #efdce2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: #b65b77;
      font-size: 20px;
      font-weight: bold;
    }

    .logout {
      border: 0;
      background: #fff0f4;
      color: #b65b77;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* CONTAINER */

    .container {
      width: min(1100px, 92%);
      margin: 30px auto;
    }

    .welcome {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      margin-bottom: 25px;
    }

    .welcome small {
      color: #b65b77;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .welcome h1 {
      font-family: Georgia, serif;
      font-size: 40px;
      margin: 8px 0;
    }

    .welcome p {
      color: #806b72;
    }

    .create-btn {
      background: #b65b77;
      color: white;

      padding: 14px 20px;
      border-radius: 13px;

      font-weight: bold;
      display: inline-block;

      box-shadow: 0 10px 25px rgba(182,91,119,.2);
    }

    /* CARD */

    .card {
      background: white;
      border: 1px solid #efdce2;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;

      box-shadow: 0 12px 40px rgba(100,50,70,.06);
    }

    .card h2 {
      margin-bottom: 18px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border: 1px solid #efdce2;
      border-radius: 18px;
      padding: 22px;
    }

    .stat-icon {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
    }

    .stat span {
      color: #806b72;
      font-size: 13px;
    }

    /* INVITATION */

    .invitation-card {
      display: grid;
      grid-template-columns: 160px 1fr auto;
      gap: 20px;
      align-items: center;
    }

    .cover {
      height: 190px;

      border-radius: 17px;

      background:
        linear-gradient(#0005,#0005),
        linear-gradient(135deg,#f5b8c8,#a75b73);

      background-size: cover;
      background-position: center;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      text-align: center;
      padding: 10px;
    }

    .cover h3 {
      font-family: Georgia, serif;
      font-size: 24px;
    }

    .details h2 {
      font-family: Georgia, serif;
      margin-bottom: 8px;
    }

    .details p {
      color: #806b72;
      margin: 5px 0;
      line-height: 1.5;
    }

    .status {
      display: inline-block;

      background: #e8f8ed;
      color: #27834a;

      padding: 6px 10px;
      border-radius: 30px;

      font-size: 12px;
      font-weight: bold;

      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action {
      border: 0;
      padding: 11px 15px;
      border-radius: 10px;

      font-weight: bold;
      cursor: pointer;

      text-align: center;
      white-space: nowrap;
    }

    .preview {
      background: #fff0f4;
      color: #b65b77;
    }

    .whatsapp {
      background: #25d366;
      color: white;
    }

    .copy {
      background: #f3edf0;
      color: #5f4b52;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      padding: 55px 20px;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty h2 {
      font-family: Georgia, serif;
      margin-bottom: 10px;
    }

    .empty p {
      color: #806b72;
      max-width: 500px;
      margin: auto auto 20px;
      line-height: 1.7;
    }

    /* LOADING */

    .loading {
      text-align: center;
      padding: 50px;
      color: #806b72;
    }

    /* MOBILE */

    @media(max-width: 750px) {

      .welcome {
        display: block;
      }

      .create-btn {
        display: block;
        text-align: center;
        margin-top: 20px;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .invitation-card {
        grid-template-columns: 1fr;
      }

      .cover {
        height: 260px;
      }

      .actions {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .action {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="dashboard.html" class="logo">
    💍 UndanganKu
  </a>

  <button class="logout" id="logout">
    Keluar
  </button>

</header>


<main class="container">

  <!-- WELCOME -->

  <section class="welcome">

    <div>

      <small>
        DASHBOARD
      </small>

      <h1>
        Halo, <span id="userName">...</span> 👋
      </h1>

      <p>
        Kelola undangan pernikahanmu di sini.
      </p>

    </div>

    <a
      href="editor.html"
      class="create-btn"
    >
      ✨ Buat / Edit Undangan
    </a>

  </section>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">

      <div class="stat-icon">
        💍
      </div>

      <strong id="status">
        Belum dibuat
      </strong>

      <span>
        Status undangan
      </span>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🔗
      </div>

      <strong id="slug">
        -
      </strong>

      <span>
        Link undangan
      </span>

    </div>


    <div class="stat">

      <div class="stat-icon">
        👁️
      </div>

      <strong id="views">
        0
      </strong>

      <span>
        Jumlah kunjungan
      </span>

    </div>

  </section>


  <!-- INVITATION -->

  <section class="card" id="invitationSection">

    <div class="loading">
      Memuat data undangan...
    </div>

  </section>


  <!-- ACCOUNT -->

  <section class="card">

    <h2>
      👤 Akun Saya
    </h2>

    <p>
      <b>Nama:</b>
      <span id="accountName">-</span>
    </p>

    <p style="margin-top:8px;">
      <b>Email:</b>
      <span id="accountEmail">-</span>
    </p>

  </section>

</main>



<script type="module">

  import {

    auth,
    db,

    onAuthStateChanged,
    signOut,

    doc,
    getDoc

  } from "./firebase.js";


  const userName =
    document.getElementById("userName");

  const accountName =
    document.getElementById("accountName");

  const accountEmail =
    document.getElementById("accountEmail");

  const status =
    document.getElementById("status");

  const slug =
    document.getElementById("slug");

  const invitationSection =
    document.getElementById(
      "invitationSection"
    );


  let invitationData = null;


  /*
  ======================================
  CEK LOGIN
  ======================================
  */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;
      }


      userName.textContent =
        user.displayName ||
        "Pengguna";

      accountName.textContent =
        user.displayName ||
        "-";

      accountEmail.textContent =
        user.email ||
        "-";


      await loadInvitation(user.uid);

    }
  );


  /*
  ======================================
  LOAD UNDANGAN
  ======================================
  */

  async function loadInvitation(uid) {

    try {

      const ref =
        doc(
          db,
          "invitations",
          uid
        );


      const snapshot =
        await getDoc(ref);


      if (!snapshot.exists()) {

        status.textContent =
          "Belum dibuat";

        slug.textContent =
          "-";


        invitationSection.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              💌
            </div>

            <h2>
              Belum ada undangan
            </h2>

            <p>
              Yuk buat undangan pernikahanmu.
              Isi data mempelai, acara, foto,
              cerita cinta, dan pilih tema.
            </p>

            <a
              href="editor.html"
              class="create-btn"
            >
              💍 Buat Undangan Sekarang
            </a>

          </div>

        `;

        return;
      }


      invitationData =
        snapshot.data();


      status.textContent =
        "Sudah dibuat";

      slug.textContent =
        invitationData.slug || "-";


      const link =
        createInvitationLink(
          invitationData.slug
        );


      invitationSection.innerHTML = `

        <div class="invitation-card">

          <div
            class="cover"
            id="coverPreview"
          >

            <h3>
              ${escapeHTML(
                invitationData.groomName || "Pria"
              )}
              <br>&
              <br>
              ${escapeHTML(
                invitationData.brideName || "Wanita"
              )}
            </h3>

          </div>


          <div class="details">

            <span class="status">
              ● UNDANGAN AKTIF
            </span>

            <h2>
              ${escapeHTML(
                invitationData.groomName || ""
              )}
              &
              ${escapeHTML(
                invitationData.brideName || ""
              )}
            </h2>

            <p>
              📅
              ${escapeHTML(
                invitationData.eventDate || "-"
              )}
            </p>

            <p>
              🕐
              ${escapeHTML(
                invitationData.eventTime || "-"
              )}
            </p>

            <p>
              📍
              ${escapeHTML(
                invitationData.location || "-"
              )}
            </p>

            <p style="margin-top:12px;">
              🔗 ${link}
            </p>

          </div>


          <div class="actions">

            <a
              href="${link}"
              target="_blank"
              class="action preview"
            >
              👁️ Lihat
            </a>

            <button
              class="action whatsapp"
              id="whatsappButton"
            >
              💬 WhatsApp
            </button>

            <button
              class="action copy"
              id="copyButton"
            >
              🔗 Salin Link
            </button>

          </div>

        </div>

      `;


      /*
      ==============================
      FOTO COVER
      ==============================
      */

      if (invitationData.image) {

        const cover =
          document.getElementById(
            "coverPreview"
          );

        cover.style.backgroundImage =
          `linear-gradient(#0005,#0005),
           url("${invitationData.image}")`;

      }


      /*
      ==============================
      WHATSAPP
      ==============================
      */

      document
        .getElementById("whatsappButton")
        .addEventListener(
          "click",
          () => {

            const message =
              `Assalamu'alaikum Wr. Wb.

Dengan memohon rahmat dan ridho Allah SWT, kami bermaksud mengundang Bapak/Ibu/Saudara/i untuk hadir di acara pernikahan kami.

💍 ${invitationData.groomName} & ${invitationData.brideName}

📅 ${invitationData.eventDate}
🕐 ${invitationData.eventTime || ""}
📍 ${invitationData.location}

💌 Silakan buka undangan kami:
${link}

Merupakan suatu kehormatan bagi kami apabila berkenan hadir.

Terima kasih ❤️`;


            window.open(
              "https://wa.me/?text=" +
              encodeURIComponent(message),
              "_blank"
            );

          }
        );


      /*
      ==============================
      COPY LINK
      ==============================
      */

      document
        .getElementById("copyButton")
        .addEventListener(
          "click",
          async () => {

            try {

              await navigator.clipboard.writeText(
                link
              );

              alert(
                "Link undangan berhasil disalin ❤️"
              );

            } catch {

              prompt(
                "Salin link berikut:",
                link
              );

            }

          }
        );


    } catch(error) {

      console.error(error);

      invitationSection.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          <h2>
            Gagal memuat data
          </h2>

          <p>
            ${escapeHTML(error.message)}
          </p>

        </div>

      `;

    }

  }


  /*
  ======================================
  LINK UNDANGAN
  ======================================
  */

  function createInvitationLink(slug) {

    const base =
      window.location.href
        .split("/")
        .slice(0, -1)
        .join("/");

    return (
      base +
      "/invitation.html?slug=" +
      encodeURIComponent(slug)
    );

  }


  /*
  ======================================
  LOGOUT
  ======================================
  */

  document
    .getElementById("logout")
    .addEventListener(
      "click",
      async () => {

        await signOut(auth);

        window.location.href =
          "index.html";

      }
    );


  /*
  ======================================
  SECURITY HTML
  ======================================
  */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt
